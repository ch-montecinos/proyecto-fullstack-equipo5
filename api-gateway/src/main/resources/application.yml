server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        - id: book-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/books/**

        - id: loan-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/loans/**